<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Bookrunner: the underwriting syndicate for on-chain perp markets. Fund one market as Senior or Junior; agents quote it under a mandate enforced on-chain." />
    <title>Bookrunner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230f766e%27/%3E%3Cpath d=%27M10 8h7a4.5 4.5 0 0 1 1.7 8.7A4.8 4.8 0 0 1 17.5 25H10z%27 fill=%27none%27 stroke=%27%23ffffff%27 stroke-width=%272.4%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M10 16.3h8%27 stroke=%27%23ffffff%27 stroke-width=%272.4%27/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Apply the stored theme before first paint (no flash). "system" leaves the attribute unset.
      try {
        var t = localStorage.getItem("bkrn.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
