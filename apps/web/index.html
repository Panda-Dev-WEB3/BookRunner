<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Bookrunner: the underwriting syndicate for on-chain perp markets. Run the book." />
    <title>Bookrunner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230b0b0b'/%3E%3Cpath d='M9 7h8.5a5 5 0 0 1 1.6 9.7A5.2 5.2 0 0 1 17.8 27H9z' fill='none' stroke='%23fcfcfb' stroke-width='2.4'/%3E%3Cpath d='M9 16.5h9' stroke='%236da7ec' stroke-width='2.4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <script>
      // Apply the stored theme before first paint (no flash). "system" leaves the attribute unset.
      try {
        var t = localStorage.getItem("bkrn.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
