# Install policy (supply chain; docs/AUDIT-2026-10.md "install controls"). Bun 1.4.2.
[install]
# Never resolve a version published less than 7 days ago (seconds): a hijacked release is usually caught and
# yanked within days. Applies whenever bun resolves (bun add / update / an install that changes the lockfile);
# CI and the server install with --frozen-lockfile, so they only ever get the exact versions in bun.lock.
minimumReleaseAge = 604800
# `bun add` saves exact versions (every dependency in this repo is pinned exactly).
exact = true
# Lifecycle scripts: bun never runs a dependency's install scripts unless it is listed in package.json
# "trustedDependencies". That list is set explicitly (only "bun", whose postinstall links its platform binary),
# which also replaces bun's built-in allowlist of popular packages.
