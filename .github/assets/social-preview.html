<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:1280px;height:640px;overflow:hidden;background:#0a1128}
.card{position:relative;width:1280px;height:640px;box-sizing:border-box;
  background:radial-gradient(1100px 640px at 18% 50%,#13224f 0%,#0a1128 60%,#070c1d 100%);
  font-family:Georgia,'Times New Roman',serif;color:#eef1f8}
.grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(140,165,230,.07) 1px,transparent 1px),
  linear-gradient(90deg,rgba(140,165,230,.07) 1px,transparent 1px);background-size:40px 40px}
.frame{position:absolute;inset:28px;border:1px solid rgba(182,201,237,.28);border-radius:6px}
.seal{position:absolute;left:96px;top:140px;width:360px;height:360px;border-radius:50%;
  background:#f4f2ec;box-shadow:0 0 0 10px rgba(244,242,236,.08),0 30px 80px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center}
.seal img{width:300px;height:300px}
.text{position:absolute;left:520px;top:150px;right:80px}
.kicker{font-family:'Segoe UI',Arial,sans-serif;font-size:22px;letter-spacing:.42em;color:#b6c9ed;font-weight:600}
h1{margin:18px 0 0;font-size:96px;line-height:1.02;font-weight:400;color:#ffffff}
.sub{margin-top:26px;font-size:32px;line-height:1.3;color:#d9e0ef;max-width:700px}
.foot{position:absolute;left:520px;bottom:72px;font-family:'Segoe UI',Arial,sans-serif;font-size:20px;
  letter-spacing:.08em;color:#8e9cbd}
.foot b{color:#cdd8f0;font-weight:600}
.rule{position:absolute;left:520px;bottom:112px;width:120px;height:2px;background:#2f5bea}
</style></head><body><div class="card">
<div class="grid"></div><div class="frame"></div>
<div class="seal"><img src="logo.png" alt=""></div>
<div class="text">
  <div class="kicker">BOOKRUNNER</div>
  <h1>Run the book.</h1>
  <div class="sub">The underwriting syndicate<br>for on&#8209;chain perp markets</div>
</div>
<div class="rule"></div>
<div class="foot"><b>bookrunner.tech</b> &nbsp;&middot;&nbsp; Robinhood Chain testnet</div>
</div></body></html>
