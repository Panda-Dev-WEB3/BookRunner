# Scanners: gitleaks (full history), Slither (contracts, reviewed allowlist), Semgrep (TypeScript / JavaScript,
# secrets, workflows, Dockerfiles, Solidity). Needs no secrets: every tool runs from an image pinned by digest
# (tag in the comment), never a marketplace action that wants a licence key or a token.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new rules / new advisories against an unchanged tree
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks (git history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks git (default rules + .gitleaks.toml allowlist + .gitleaksignore fingerprints)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --exit-code 1 \
            --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore .
        # image: ghcr.io/gitleaks/gitleaks:v8.30.1

  slither:
    name: Slither
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: forge build of src/ with build info (pinned Foundry image)
        run: bash scripts/forge.sh build --build-info --out out-slither --cache-path cache-slither src
      - name: forge binary for crytic-compile (it reads `forge config`)
        run: |
          # shellcheck disable=SC2016 # the ${FOUNDRY_IMAGE:-...} in the pattern is literal text of scripts/forge.sh
          image=$(sed -n 's/^IMAGE="${FOUNDRY_IMAGE:-\(.*\)}"$/\1/p' scripts/forge.sh)
          case "$image" in *@sha256:*) ;; *) echo "scripts/forge.sh image is not pinned by digest: $image"; exit 1 ;; esac
          id=$(docker create "$image")
          mkdir -p "$RUNNER_TEMP/foundry"
          docker cp "$id:/usr/local/bin/forge" "$RUNNER_TEMP/foundry/forge"
          docker rm "$id" >/dev/null
      - name: slither (contracts/slither.config.json)
        run: |
          # shellcheck disable=SC2016 # $PATH expands inside the container
          docker run --rm --user root -v "$PWD:/repo" -v "$RUNNER_TEMP/foundry:/opt/foundry:ro" -w /repo/contracts \
            --entrypoint sh \
            ghcr.io/crytic/slither@sha256:89d4127ec3bfeba9725a863c58dd96b01781ff73737871dd3b07606ebc4cf16b \
            -c 'export PATH=/opt/foundry:$PATH; slither . --config-file slither.config.json --json slither-out.json || true'
        # image: ghcr.io/crytic/slither:0.11.6; it exits non-zero whenever it reports anything, the gate decides
      - name: gate (every Medium / High finding must be in contracts/slither-allowlist.json)
        run: bun scripts/slither-gate.ts contracts/slither-out.json contracts/slither-allowlist.json

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep scan (ERROR and WARNING block; .semgrepignore)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep scan --metrics=off --disable-version-check \
            --config p/typescript --config p/javascript --config p/secrets \
            --config p/github-actions --config p/dockerfile --config p/smart-contracts \
            --severity ERROR --severity WARNING --error
        # image: semgrep/semgrep:1.178.0 (rule packs are fetched from the Semgrep registry at run time)
