# MTA-STS policy of bookrunner.tech (RFC 8461), included by the mta-sts.bookrunner.tech site
# (nginx-bookrunner-mta-sts.conf). Installed to /etc/nginx/snippets/bookrunner-mta-sts.conf by install.sh / update.sh
# (validated with `nginx -t`, rolled back on failure), so a policy change ships with a normal update.
#
#   mode     testing first: senders report TLS failures (the _smtp._tls TLS-RPT record) but still deliver. Switch to
#            enforce after two weeks of clean reports; then bump the id of the _mta-sts TXT record (README.md "Mail
#            anti-spoofing records"), or senders keep the cached policy until max_age runs out.
#   mx       every MX host of bookrunner.tech (dig MX bookrunner.tech: mail.ignition-x.com). A new MX must be listed
#            here BEFORE it goes into DNS, or enforcing senders refuse to deliver to it.
#   max_age  1 day while testing; 1209600 (14 days) once enforced.
location = /.well-known/mta-sts.txt {
    types { }
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control "public, max-age=3600" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 "version: STSv1\nmode: testing\nmx: mail.ignition-x.com\nmax_age: 86400\n";
}
location / {
    return 404;
}
