name: bookrunner

# Server infra for the testnet stack (a shared host: small, capped, loopback-only).
#   Postgres + Timescale  127.0.0.1:54400   (image pinned to the digest the testnet DB was created with)
#   Redis                 127.0.0.1:63790   (AOF on: risk journals, signed venue reports, job queues survive restarts)
# Started by bookrunner.service (ExecStartPre). No anvil: the stack runs against Robinhood Chain testnet.
services:
  postgres:
    image: timescale/timescaledb@sha256:b346edcdb51a1fd6020e3965e0bd1c9f3406fa6d5fbce1e28f4852587ef934e2 # latest-pg17, Timescale 2.30.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookrunner
      POSTGRES_PASSWORD: bookrunner # loopback-only port; the DB holds public chain data + mock-venue state
      POSTGRES_DB: bookrunner
      TS_TUNE_MEMORY: 384MB
      TS_TUNE_NUM_CPUS: "1"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=120
      - -c
      - timescaledb.telemetry_level=off
    ports:
      - "127.0.0.1:54400:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrunner -d bookrunner"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:63790:6379"
    volumes:
      - redisdata:/data
    mem_limit: 128m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
