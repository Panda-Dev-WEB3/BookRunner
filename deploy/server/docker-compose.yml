name: bookrunner

# Server infra for the testnet stack (a shared host: small, capped, loopback-only).
#   Postgres + Timescale  127.0.0.1:54400   (image pinned to the digest the testnet DB was created with)
#   Redis                 127.0.0.1:63790   (AOF on: risk journals, signed venue reports, job queues survive restarts)
# Started by bookrunner-infra.service (root) from the root-owned copy /usr/local/lib/bookrunner-deploy:
#   docker compose --env-file /usr/local/lib/bookrunner-deploy/.env.infra -f .../docker-compose.yml up -d --wait
# No anvil: the stack runs against Robinhood Chain testnet.
#
# Passwords come from .env.infra (root:root 0600, generated by install.sh, never in git):
#   POSTGRES_PASSWORD  only initialises a NEW data directory: on an existing volume the password is whatever
#                      `ALTER USER bookrunner PASSWORD ...` last set (HARDENING.md has the migration steps)
#   REDIS_PASSWORD     requirepass (written to a config file inside the container, never on a command line)
# Unset (no .env.infra): the historical defaults, Postgres "bookrunner" and Redis without auth.
services:
  postgres:
    image: timescale/timescaledb@sha256:b346edcdb51a1fd6020e3965e0bd1c9f3406fa6d5fbce1e28f4852587ef934e2 # latest-pg17, Timescale 2.30.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookrunner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookrunner}
      POSTGRES_DB: bookrunner
      TS_TUNE_MEMORY: 384MB
      TS_TUNE_NUM_CPUS: "1"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=120
      - -c
      - timescaledb.telemetry_level=off
    ports:
      - "127.0.0.1:54400:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrunner -d bookrunner"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # requirepass goes into a config file (printf is a shell builtin: the password never appears in a
    # process command line on the host); the image's entrypoint then drops to the redis user as before
    command:
      - sh
      - -c
      - |
        umask 077
        if [ -n "$$REDIS_PASSWORD" ]; then printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/bookrunner-auth.conf; else : > /tmp/bookrunner-auth.conf; fi
        chown redis:redis /tmp/bookrunner-auth.conf
        exec docker-entrypoint.sh redis-server /tmp/bookrunner-auth.conf --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:63790:6379"
    volumes:
      - redisdata:/data
    mem_limit: 128m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
