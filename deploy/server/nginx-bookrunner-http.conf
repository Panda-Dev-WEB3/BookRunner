# Bookrunner: http{}-level nginx directives (rate-limit zones). Installed to
# /etc/nginx/conf.d/bookrunner-ratelimit.conf by install.sh / update.sh / patch-nginx.sh (nginx-lib.sh:
# validated with `nginx -t`, rolled back on failure), BEFORE the locations snippet that uses the zones.
# Ubuntu's nginx.conf includes /etc/nginx/conf.d/*.conf inside http{}.
#
# Only uniquely named zones (and the map variable feeding one) here: anything global (server_tokens, ...) is set per server in the
# locations snippet, so this shared host's other sites are untouched and nothing can clash with a
# directive nginx.conf already sets.

# /trpc/: one IP may sustain 20 requests/s (bursts of 60 served at once). The web app batches up to 10
# procedures per request (services/api MAX_TRPC_BATCH) and polls every 2-15 s per query, so a person
# with several tabs stays far below this; a scripted flood gets 429s instead of fanning out into DB and
# chain reads.
limit_req_zone $binary_remote_addr zone=bookrunner_trpc:10m rate=20r/s;
# /health: polled every 10 s per open app tab.
limit_req_zone $binary_remote_addr zone=bookrunner_health:2m rate=5r/s;
# /trpc/ calls of receipts.* (Merkle proofs and roots, audit M-4): a stricter per-IP zone on top of
# bookrunner_trpc. The key is empty (not limited) for every other /trpc/ path. The verify panel of a book
# asks for a few of them per click (the web client sends each alone: one receipts.* call fills a batch,
# services/api TRPC_HEAVY_WEIGHT); 2/s with bursts of 10 leaves people unaffected and caps a script.
map $uri $bookrunner_receipts_key {
    default "";
    "~^/trpc/(?:[^,]*,)*receipts\." $binary_remote_addr;
}
limit_req_zone $bookrunner_receipts_key zone=bookrunner_receipts:2m rate=2r/s;
# /trpc/ calls of the trading page's wallet reads (trade.quote / trade.position: chain reads per wallet, review I-7): a
# per-IP zone on top of bookrunner_trpc. The web polls them every 3 s per open market page; 3/s with bursts of 15 leaves
# a trader unaffected and stops one IP from driving paid RPC with random wallets (the API also caches each wallet 2 s
# and weighs them 5 in a batch).
map $uri $bookrunner_wallet_key {
    default "";
    "~^/trpc/(?:[^,]*,)*trade\.(?:quote|position)(?:,|$)" $binary_remote_addr;
}
limit_req_zone $bookrunner_wallet_key zone=bookrunner_wallet:2m rate=3r/s;
