# Bookrunner: http{}-level nginx directives (rate-limit zones). Installed to
# /etc/nginx/conf.d/bookrunner-ratelimit.conf by install.sh / update.sh / patch-nginx.sh (nginx-lib.sh:
# validated with `nginx -t`, rolled back on failure), BEFORE the locations snippet that uses the zones.
# Ubuntu's nginx.conf includes /etc/nginx/conf.d/*.conf inside http{}.
#
# Only uniquely named zones here: anything global (server_tokens, ...) is set per server in the
# locations snippet, so this shared host's other sites are untouched and nothing can clash with a
# directive nginx.conf already sets.

# /trpc/: one IP may sustain 20 requests/s (bursts of 60 served at once). The web app batches up to 10
# procedures per request (services/api MAX_TRPC_BATCH) and polls every 2-15 s per query, so a person
# with several tabs stays far below this; a scripted flood gets 429s instead of fanning out into DB and
# chain reads.
limit_req_zone $binary_remote_addr zone=bookrunner_trpc:10m rate=20r/s;
# /health: polled every 10 s per open app tab.
limit_req_zone $binary_remote_addr zone=bookrunner_health:2m rate=5r/s;
