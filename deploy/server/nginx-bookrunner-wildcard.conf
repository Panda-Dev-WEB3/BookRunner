# Bookrunner: any other *.bookrunner.tech name (the DNS has a wildcard record pointing at this host) is sent
# to the site instead of falling through to whichever server{} is this host's port-80 default (another
# project's). Installed to /etc/nginx/sites-available/bookrunner-wildcard and enabled by install.sh /
# update.sh (nginx-lib.sh nginx_install_wildcard_site: validated with `nginx -t`, rolled back on failure).
#
# Port 80 only: there is no wildcard certificate, so an https:// request for an unknown name still meets
# another server's certificate. Names with their own exact server_name are not affected, because nginx
# prefers an exact name over a wildcard: bookrunner.tech / www.bookrunner.tech (nginx-bookrunner.conf and
# certbot's redirect block) and leveret.bookrunner.tech (another project on this host, its own site file).
server {
    listen 80;
    listen [::]:80;
    server_name *.bookrunner.tech;

    server_tokens off;
    return 301 https://bookrunner.tech/;
}
