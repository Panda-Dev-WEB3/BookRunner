# Bookrunner: public site at /, operator app at /app/, API proxy. Installed to
# /etc/nginx/sites-available/bookrunner and enabled (first install only: see install.sh).
# HTTP only here: `certbot --nginx -d bookrunner.use-cert.com` adds the TLS listeners and the redirect,
# moving this block to 443. The locations live in a snippet (nginx-bookrunner-locations.conf, installed
# to /etc/nginx/snippets/bookrunner-locations.conf by install.sh and update.sh), so they can change
# without touching this certbot-managed file. A site installed before the snippet existed is converted
# once by patch-nginx.sh.
server {
    listen 80;
    listen [::]:80;
    # bookrunner.use-cert.com needs its DNS A record; the sslip.io name resolves to this IP with no DNS setup
    server_name bookrunner.tech www.bookrunner.tech bookrunner.use-cert.com bookrunner.141-94-203-130.sslip.io;

    # apps/site/dist here, apps/web/dist in /var/www/bookrunner/app/ (update.sh)
    root /var/www/bookrunner;
    index index.html;

    # server-level headers reach only the locations that set none (the redirects); every other location
    # in the snippet sends its own full set: HSTS, Content-Security-Policy ($bookrunner_csp), Permissions-Policy
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # also: server_tokens off, the CSP, rate limits (zones: /etc/nginx/conf.d/bookrunner-ratelimit.conf)
    include /etc/nginx/snippets/bookrunner-locations.conf;
}
