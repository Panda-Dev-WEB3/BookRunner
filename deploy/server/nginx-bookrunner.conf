# Bookrunner: public site at /, operator app at /app/, API proxy. Installed to
# /etc/nginx/sites-available/bookrunner and enabled (first install only: see install.sh).
# HTTP only here: `certbot --nginx -d bookrunner.tech -d www.bookrunner.tech` adds the TLS listeners and the
# redirect, moving this block to 443 (the certificate covers exactly these two names). The locations live
# in a snippet (nginx-bookrunner-locations.conf, installed to /etc/nginx/snippets/bookrunner-locations.conf
# by install.sh and update.sh), so they can change without touching this certbot-managed file. The snippet
# also sends www.bookrunner.tech to https://bookrunner.tech (301). A site installed before the snippet
# existed is converted once by patch-nginx.sh. Other *.bookrunner.tech names: nginx-bookrunner-wildcard.conf.
server {
    listen 80;
    listen [::]:80;
    server_name bookrunner.tech www.bookrunner.tech;

    # apps/site/dist here, apps/web/dist in /var/www/bookrunner/app/ (update.sh)
    root /var/www/bookrunner;
    index index.html;

    # server-level headers reach only the responses no location answers with its own set (the www -> apex
    # and other redirects); every location in the snippet sends its own full set: HSTS,
    # Content-Security-Policy ($bookrunner_csp), Permissions-Policy. HSTS covers subdomains (no preload):
    # every *.bookrunner.tech name a browser visits must serve HTTPS. update.sh brings a live
    # (certbot-managed) copy of this line up to date (nginx-lib.sh nginx_patch_site_hsts).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # also: server_tokens off, gzip, the CSP, rate limits (zones: /etc/nginx/conf.d/bookrunner-ratelimit.conf)
    include /etc/nginx/snippets/bookrunner-locations.conf;
}
