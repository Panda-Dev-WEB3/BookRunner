# Bookrunner: mta-sts.bookrunner.tech, the host MTA-STS policy fetchers read (RFC 8461: sending mail servers GET
# https://mta-sts.bookrunner.tech/.well-known/mta-sts.txt when the _mta-sts TXT record exists; README.md "Mail
# anti-spoofing records"). Its own site file, because the *.bookrunner.tech catch-all (nginx-bookrunner-wildcard.conf)
# redirects every other name to the apex and the policy must be served from this exact host over HTTPS.
#
# Installed ONCE to /etc/nginx/sites-available/bookrunner-mta-sts and enabled by update.sh / install.sh
# (nginx-lib.sh nginx_install_mta_sts_site: `nginx -t`, rolled back on failure), never overwritten afterwards: the
# certificate step below rewrites it in place, like the main site. The policy itself lives in the snippet
# /etc/nginx/snippets/bookrunner-mta-sts.conf (nginx-bookrunner-mta-sts-locations.conf), re-installed by every update.
#
# Certificate (owner, once, after the first update.sh that installs this file; DNS already resolves the name through
# the wildcard record):
#   sudo certbot --nginx -d mta-sts.bookrunner.tech
# certbot adds the 443 listener and its own port-80 redirect to this file and renews it with the other certificates.
# Until then the policy is only on port 80, which senders ignore: publish the _mta-sts TXT record AFTER this step.
server {
    listen 80;
    listen [::]:80;
    server_name mta-sts.bookrunner.tech;

    server_tokens off;
    include /etc/nginx/snippets/bookrunner-mta-sts.conf;
}
