# Bookrunner locations: the public site at /, the operator app (apps/web) at /app/, the API proxies.
# Included INSIDE the serving server{} block (the TLS one once certbot ran):
#   include /etc/nginx/snippets/bookrunner-locations.conf;
# install.sh / update.sh install this file there (nginx cannot read /opt/bookrunner, mode 750), so a
# location change ships with a normal update and never needs an edit of the certbot-managed site file.
# Needs the rate-limit zones of nginx-bookrunner-http.conf (/etc/nginx/conf.d/bookrunner-ratelimit.conf),
# which the same scripts install first.
# The including server{} sets `root /var/www/bookrunner;` and `index index.html;`.
# Every location that sets its own add_header repeats the security headers (add_header is not inherited
# once a level defines one). Long-lived Cache-Control has no `always`, so a 404 (e.g. mid-deploy) is never cached.
#
# /var/www/bookrunner/      apps/site/dist  (multi-page static tree: /research/, /jobs/, /documents/, ...)
# /var/www/bookrunner/app/  apps/web/dist   (single-page app, vite base /app/)

# ---- canonical host: www.bookrunner.tech -> https://bookrunner.tech (same path and query). A server-level
# `if` holding only a `return` is safe. The 301 is answered in the server context, so it carries the
# site file's server-level headers (HSTS with includeSubDomains: nginx-bookrunner.conf; a certbot-managed
# live site is brought in line by update.sh, nginx-lib.sh nginx_patch_site_hsts).
if ($host = www.bookrunner.tech) {
    return 301 https://bookrunner.tech$request_uri;
}

# relative Location headers on redirects (/research -> /research/): right scheme and host behind TLS
absolute_redirect off;
# no nginx version in the Server header or on error pages
server_tokens off;
limit_req_status 429;

# ---- compression for this server only (Ubuntu's nginx.conf turns gzip on for text/html alone). The Framer
# pages are ~0.4-1.4 MB of HTML; their runtime (/assets/framer/*.mjs, text/javascript), CSS, JSON (tRPC,
# /status.json, brand-copy.json), SVG, robots.txt / security.txt and the sitemap compress the same way.
# Images, video and woff2 are already compressed and are left out.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml image/x-icon;

# ---- Content-Security-Policy (site, desk and app alike). Pages that build wallet transactions (/dashboard/,
# /app/) live on this origin, so no page may run injected script:
#   script-src  'self' + the sha256 of every inline <script> the pages ship (no 'unsafe-inline'):
#               apps/site/public/**/*.html (Framer exports: 6 distinct inline scripts) and apps/web/index.html
#               (theme bootstrap). Hashes are over the newline-normalised text (the browser's view; the
#               Framer files are stored CRLF). apps/site/test/csp.test.ts recomputes them and fails when a
#               page changes without this list being updated. Deliberately blocked: Framer's on-page editing
#               bar (https://framer.com/edit/init.mjs, a third-party script the export loads for every visitor).
#   style-src   'unsafe-inline': Framer markup carries inline <style> blocks and thousands of style attributes
#   img/media/font/connect: Framer CMS chunks + images on framerusercontent.com, Google Fonts, the testnet RPC
#               (wallet reads), WalletConnect / Reown relays (only used when the app is built with a project id).
#               No other third-party host: the template's avatar images (a chatgpt.site media host) and the
#               YouTube frame hosts were dropped with the content that used them (apps/site/test/csp.test.ts
#               checks that the pages reference no image host outside img-src).
#               JSON-LD (<script type="application/ld+json">) is a data block, never executed: no hash needed.
#   worker-src  blob: (Framer spins up blob workers)
set $bookrunner_csp "default-src 'self'; script-src 'self' 'sha256-t2vIQ++0Uc6+d8MX8VTj91tBlwy6Hf6ubyQNl4fgpgE=' 'sha256-qOi5T08WW1Htc5YADz4C7xQhGtVYMbLaccGi9smu3Lw=' 'sha256-0TMJt/dENKI8PsDY9Ese9cXlRIwtvIzB0u/2QKTp2+M=' 'sha256-8WI9xq5+bHm6biJTg8NJNnEW6B8NihChU2jZSm33DIA=' 'sha256-mxGLvoz2gWXnu6wUgCfErK9GUDaFpmS1VC2StwtQorc=' 'sha256-VKspUb56ajrdvGgRx1ncNE9iIgOGrDGnAYWKEqXtNf0=' 'sha256-jirkRgvtjCBIClR0j9PIRMJp7tmfqRnjhUtIZt1ibvw='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://framerusercontent.com; img-src 'self' data: blob: https://framerusercontent.com https://*.walletconnect.com https://*.reown.com; media-src 'self' blob: https://framerusercontent.com; connect-src 'self' https://rpc.testnet.chain.robinhood.com https://framerusercontent.com https://*.walletconnect.com wss://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.org https://*.reown.com wss://*.reown.com; worker-src 'self' blob:; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

# ---- real visitor IP behind Cloudflare. Once bookrunner.tech is proxied by Cloudflare, every request reaches
# nginx from a Cloudflare edge address; without this, the per-IP rate limits (/trpc/, /health) and the logs
# would see a handful of Cloudflare IPs instead of the visitors. CF-Connecting-IP is trusted ONLY when the
# connection comes from a published Cloudflare range (https://www.cloudflare.com/ips/, checked 2026-10-14;
# refresh if Cloudflare publishes new ranges); a direct visitor cannot spoof it. Harmless before the switch.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---- retired template article (the old "specification" page): its links now point to the rulebook at
# /documents/; old URLs (bookmarks, search engines) follow with a permanent redirect
location ~ ^/(?:research/)?human-creativity-benchmark(?:/|$) {
    return 301 /documents/;
}

# ---- source maps are never published (the builds do not emit them either: vite build.sourcemap false)
location ~* \.map$ {
    return 404;
}

# ---- API (services/api on loopback): the app calls /health and /trpc at the host root, never under /app/
location = /health {
    limit_req zone=bookrunner_health burst=20 nodelay;
    proxy_pass http://127.0.0.1:4400;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
}
# public status JSON (the site's /status/ page reads it; external uptime monitors may poll it): the API's
# GET /status. The API computes it at most every 15 s whatever the traffic and sends
# Cache-Control: public, max-age=30; per-IP limit shared with /health. /status itself is the site page
# (/status -> 301 /status/ via the site location below).
location = /status.json {
    limit_req zone=bookrunner_health burst=20 nodelay;
    proxy_pass http://127.0.0.1:4400/status;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
}
# ^~: no regex location below (.html, video) ever takes an API path
location ^~ /trpc/ {
    # per-IP rate limit (zone: nginx-bookrunner-http.conf); the API also caps batches at 10 calls
    limit_req zone=bookrunner_trpc burst=60 nodelay;
    proxy_pass http://127.0.0.1:4400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 256k;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ---- operator app (apps/web) under /app/
# hashed build assets never change (^~: no regex location below applies to them, so maps are refused here)
location ^~ /app/assets/ {
    location ~* \.map$ {
        return 404;
    }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $bookrunner_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
location = /app {
    return 301 /app/$is_args$args;
}
# single-page app: every /app/ route serves /app/index.html, never cached. ^~: the regex locations below
# (.html, .mjs, video) never take an /app/ path, so the SPA fallback (an internal redirect to
# /app/index.html) comes back here and keeps X-Robots-Tag; the operator app is not for search engines
# (apps/web/index.html also carries <meta name="robots" content="noindex">; robots.txt disallows /app/).
location ^~ /app/ {
    location ~* \.map$ {
        return 404;
    }
    try_files $uri $uri/ /app/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $bookrunner_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
# the app used to live at the root: old links (/books/7, /learn#term-senior, ...) move under /app/.
# Remove a name here if the public site ever gets a page of the same name.
location ~ ^/(?:invest|portfolio|stake|learn|books|charters|committee|risk|agents)(?:/|$) {
    return 301 /app$request_uri;
}

# ---- site HTML: never cached, so a deploy is picked up at once. Directory index pages (/, /research/)
# reach this location through nginx's internal redirect (the app's HTML stays in ^~ /app/ above).
location ~* \.html?$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $bookrunner_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}

# ---- ES modules (the site's Framer runtime under /assets/framer/*.mjs): nginx's mime.types has no .mjs,
# and browsers refuse module scripts served as application/octet-stream (the home page then never mounts)
location ~* \.mjs$ {
    types {
        text/javascript mjs;
    }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $bookrunner_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}

# ---- video (the site's clips): explicit MIME types (whatever mime.types ships), byte ranges are on by
# default for static files (seeking, Safari)
location ~* \.(?:webm|mp4)$ {
    types {
        video/webm webm;
        video/mp4 mp4;
    }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}

# ---- security contact (RFC 9116; apps/site/public/.well-known/security.txt, copied to dist/ by vite).
# Exact match, served as UTF-8 text/plain whatever mime.types says; nothing here denies dot paths.
location = /.well-known/security.txt {
    types { }
    default_type "text/plain; charset=utf-8";
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}

# ---- public site (apps/site) at the root
# site assets are NOT content-hashed: a moderate cache, so a redeploy shows within a day at most
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $bookrunner_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
# multi-page static tree: /research -> 301 /research/ -> research/index.html; unknown paths are a 404
location / {
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "public, max-age=3600";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $bookrunner_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
