# Drop-in for bookrunner@testnet-live: the live-Orderly rehearsal stack (scripts/dev.ts --network testnet-live) that runs
# NEXT TO the public testnet stack (bookrunner.service, untouched) on the same host. Installed to
# /etc/systemd/system/bookrunner@testnet-live.service.d/override.conf by install.sh / update.sh; never enabled by them.
#   sudo systemctl start bookrunner@testnet-live      # start (also: enable to keep it across reboots)
#   sudo systemctl stop bookrunner@testnet-live
#   sudo tail -f /opt/bookrunner/app/.data/testnet-live/dev.log
# Separate everything: its own mnemonic (BKRN_TESTNET_LIVE_MNEMONIC), record contracts/deployments/46630.live.json, DB
# bookrunner_testnet_live, its own Redis instance redis-live (127.0.0.1:63791) and bus namespace testnet-live, state .data/testnet-live, loopback ports 4500 / 4510 / 4530 (nginx routes no public
# traffic to them; docs/RUNBOOK.md "Testnet rehearsal on real Orderly"). Env: ONLY /etc/bookrunner/testnet-live.env
# (root:root 0600, one line per key; the template's EnvironmentFile, also parsed by rehearsal-deploy.sh); no .env.testnet-live.
[Unit]
Description=Bookrunner testnet-live stack (live-Orderly rehearsal, next to bookrunner.service)

[Service]
# its own budget, below the public stack's (2 G / 2.5 G): fewer books, no trader-sim / mock-orderly
MemoryHigh=1536M
MemoryMax=2G
MemorySwapMax=1G
# the launch appends the chartered books to contracts/deployments/46630.live.json (first start / a resumed launch)
ReadWritePaths=-/opt/bookrunner/app/contracts/deployments
